[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlib-datasinking"
version = "0.1.0"
description = "DataSinking data source for Qlib/backtrader — full-text financial reports as DataFrames"
authors = [{ name = "DataSinking", email = "support@datasink.ing" }]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["qlib", "financial reports", "10-k", "fundamental data", "quant"]
dependencies = [
    "requests>=2.31.0",
    "pandas>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["qlib_datasinking"]
